<!DOCTYPE html>
<html>
<head>
  <title>Valentine 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #ffd6e8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      overflow: hidden;
    }
    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 320px;
    }
    button {
      font-size: 18px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      margin: 10px;
    }
    #no {
      position: absolute;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Will you be my Valentine? 💘</h2>
    <button onclick="alert('YAY 💕')">Yes</button>
    <button id="no">No</button>
  </div>

<script>
  const noBtn = document.getElementById("no");
  function move() {
    noBtn.style.left = Math.random() * 80 + "vw";
    noBtn.style.top = Math.random() * 80 + "vh";
  }
  noBtn.addEventListener("touchstart", move);
  noBtn.addEventListener("mouseover", move);
</script>
</body>
</html>
